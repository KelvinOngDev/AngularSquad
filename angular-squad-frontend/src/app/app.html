@if (auth.isAuthenticated()) {
  <div class="min-h-screen bg-slate-100">
    <app-sidebar class="fixed inset-y-0 left-0 z-30 block h-full w-16 md:w-64"></app-sidebar>

    <div class="flex min-h-screen min-w-0 flex-col pl-16 md:pl-64">
      <header class="border-b border-slate-200 bg-white px-4 py-4 md:px-8">
        <h1 class="text-lg font-bold text-slate-900 md:text-xl">Angular Squad</h1>
      </header>

      <main class="min-w-0 flex-1 p-4 md:p-8">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}
