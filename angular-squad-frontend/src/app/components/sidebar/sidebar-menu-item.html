@if (hasChildren()) {
  @if (menu().url_menu) {
    <div class="flex items-center rounded-lg text-slate-300 transition hover:bg-slate-800/70 hover:text-white">
      <a
        [routerLink]="menu().url_menu"
        routerLinkActive="bg-slate-800 text-white font-medium"
        (click)="expanded.set(true)"
        class="flex flex-1 items-center gap-3 rounded-l-lg px-3 py-2.5 text-sm"
      >
        <i class="w-4 text-center" [class]="iconClass()"></i>
        <span class="truncate">{{ menu().menu_name }}</span>
      </a>
      <button
        type="button"
        (click)="toggle($event)"
        [attr.aria-label]="(expanded() ? 'Collapse ' : 'Expand ') + menu().menu_name"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="'menu-children-' + menu().id"
        class="rounded-r-lg px-3 py-2.5 text-slate-400 hover:text-white"
      >
        <i
          class="fas fa-chevron-right text-xs transition-transform duration-200"
          [class.rotate-90]="expanded()"
        ></i>
      </button>
    </div>
  } @else {
    <button
      type="button"
      (click)="toggle($event)"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="'menu-children-' + menu().id"
      class="flex w-full items-center justify-between rounded-lg px-3 py-2.5 text-left text-sm text-slate-300 transition hover:bg-slate-800/70 hover:text-white"
    >
      <span class="flex items-center gap-3 truncate">
        <i class="w-4 text-center" [class]="iconClass()"></i>
        <span class="truncate">{{ menu().menu_name }}</span>
      </span>
      <i
        class="fas fa-chevron-right text-xs text-slate-400 transition-transform duration-200"
        [class.rotate-90]="expanded()"
      ></i>
    </button>
  }

  <ul
    [id]="'menu-children-' + menu().id"
    class="mt-1 ml-3 space-y-1 border-l border-slate-700/80 pl-3"
    [class.hidden]="!expanded()"
    [attr.aria-hidden]="!expanded()"
  >
    @for (child of menu().children; track child.id) {
      <app-sidebar-menu-item [menu]="child" />
    }
  </ul>
} @else if (menu().url_menu) {
  <a
    [routerLink]="menu().url_menu"
    routerLinkActive="bg-slate-800 text-white font-medium"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-300 transition hover:bg-slate-800/70 hover:text-white"
  >
    <i class="w-4 text-center" [class]="iconClass()"></i>
    <span class="truncate">{{ menu().menu_name }}</span>
  </a>
} @else {
  <span class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-400">
    <i class="w-4 text-center" [class]="iconClass()"></i>
    <span class="truncate">{{ menu().menu_name }}</span>
  </span>
}
