<main class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl shadow-slate-200/70">
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-widest text-blue-600">Belajar Angular</p>
      <h1 class="mt-3 text-3xl font-bold text-slate-900">Masuk ke akun</h1>
      <p class="mt-2 text-sm text-slate-500">Masukkan username dan password Anda untuk melanjutkan.</p>
    </div>

    @if (errorMessage) {
      <p role="alert" class="mb-5 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">
        {{ errorMessage }}
      </p>
    }

    <form class="space-y-5" (ngSubmit)="submit()">
      <div>
        <label for="username" class="mb-1.5 block text-sm font-medium text-slate-700">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          [(ngModel)]="username"
          class="w-full rounded-lg border border-slate-300 px-3.5 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          placeholder="Username"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          [(ngModel)]="password"
          class="w-full rounded-lg border border-slate-300 px-3.5 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          placeholder="Password"
        />
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting || !username.trim() || !password"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isSubmitting ? 'Memproses...' : 'Masuk' }}
      </button>
    </form>
  </section>
</main>
