<section class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <p class="text-sm font-medium text-slate-500">Akses aplikasi</p>
      <h2 class="mt-1 text-2xl font-bold text-slate-900">Manajemen User</h2>
    </div>
    <button
      type="button"
      class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
    >
      Tambah User
    </button>
  </div>

  <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full min-w-[640px] divide-y divide-slate-200 text-left text-sm">
        <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
          <tr>
            <th scope="col" class="px-6 py-4 font-semibold">Nama</th>
            <th scope="col" class="px-6 py-4 font-semibold">Username</th>
            <th scope="col" class="px-6 py-4 font-semibold">Email</th>
            <th scope="col" class="px-6 py-4 text-right font-semibold">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (user of users; track user.id) {
            <tr class="text-slate-700 transition hover:bg-slate-50">
              <td class="whitespace-nowrap px-6 py-4 font-medium text-slate-900">{{ user.nama }}</td>
              <td class="px-6 py-4">{{ user.username }}</td>
              <td class="px-6 py-4">{{ user.email }}</td>
              <td class="whitespace-nowrap px-6 py-4 text-right">
                <div class="flex justify-end gap-2">
                  <button type="button" class="rounded-md bg-yellow-400 px-3 py-1.5 font-semibold text-yellow-950 transition hover:bg-yellow-500">Edit</button>
                  <button type="button" class="rounded-md bg-red-600 px-3 py-1.5 font-semibold text-white transition hover:bg-red-700">Hapus</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="px-6 py-10 text-center text-slate-500">Belum ada data user.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
